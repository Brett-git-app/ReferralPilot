services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: iris-community:2026.3.0AI.154.0
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REFERRALPILOT_MODEL: ${REFERRALPILOT_MODEL:-gpt-5-nano}
      REFERRALPILOT_DEMO_MODE: ${REFERRALPILOT_DEMO_MODE:-true}
    ports:
      - "1972:1972"
      - "52773:52773"
    restart: unless-stopped
