services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${REFERRALPILOT_IMAGE:-iris-community:2027.1.0AI.109.0}
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REFERRALPILOT_MODEL: ${REFERRALPILOT_MODEL:-gpt-5-nano}
      REFERRALPILOT_DEMO_MODE: ${REFERRALPILOT_DEMO_MODE:-true}
      REFERRALPILOT_ALLOW_DEMO_RESET: ${REFERRALPILOT_ALLOW_DEMO_RESET:-}
      REFERRALPILOT_API_TOKEN: ${REFERRALPILOT_API_TOKEN:-}
      REFERRALPILOT_REQUIRE_REVIEWER: ${REFERRALPILOT_REQUIRE_REVIEWER:-}
    ports:
      - "127.0.0.1:1972:1972"
      - "127.0.0.1:52773:52773"
    volumes:
      - referralpilot-iris:/usr/irissys
    restart: unless-stopped

volumes:
  referralpilot-iris:
